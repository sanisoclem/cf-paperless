name = "cf-paperless"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
keep_vars = true

[build]
command = "worker-build --release"

[observability]
enabled = true

[[r2_buckets]]
binding = "INBOX"
bucket_name = "paperless-inbox"

[vars]
ALLOWED_EXTENSIONS = "pdf,jpg,jpeg,tif,tiff,png"
