[package]
name = "cf-paperless"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mail-parser = "0.11.9"
web-sys = { version = "0.3", features = ["Crypto", "WorkerGlobalScope"] }
worker = "0.8.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
